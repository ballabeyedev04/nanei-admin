# ═══════════════════════════════════════════════════════════════════════════
#  Nanei admin — règles Nginx communes (à inclure dans le bloc server)
# ═══════════════════════════════════════════════════════════════════════════
#
#  Serveur : /etc/nginx/snippets/nanei-admin-commun.conf, inclus par
#  deploy/nginx-admin.conf. Le test de démarrage de la chaîne (job 4) sert le
#  livrable avec CE fichier : ce qui est testé est ce qui est en production.
#
#  `root /var/www/nanei-admin;` est défini dans le bloc server. Ce chemin est un
#  LIEN SYMBOLIQUE vers la version servie (deploy/mettre-en-service.sh) :
#  Nginx suit les liens symboliques par défaut. NE PAS activer
#  `disable_symlinks` (valeur par défaut : off), sinon le site renvoie 403/404.

index index.html;

# Rappel Nginx : un bloc location qui définit un add_header n'hérite d'AUCUN
# add_header du niveau server. Les en-têtes de sécurité (dont HSTS, ignoré
# par les navigateurs en HTTP) sont donc répétés dans chaque bloc.

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

# Fichiers cachés (.git, .env…) : jamais servis. /.well-known/ reste
# accessible (renouvellement des certificats Let's Encrypt).
location ~ /\.(?!well-known/) {
    return 404;
}

# Ressources hachées par Vite (index-AbC123.js) : leur nom change à chaque
# version, elles peuvent être gardées un an par les navigateurs. Une ressource
# absente répond 404 (et non la page HTML, qu'un navigateur prendrait pour du JS).
location /assets/ {
    try_files $uri =404;
    # Sans « always » : une 404 n'est pas gardée un an par les navigateurs.
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

# Page d'entrée et version servie : toujours revalidées. Sans cela, un
# navigateur garderait l'ancien index.html (qui pointe vers d'anciennes
# ressources) et la chaîne ne pourrait pas vérifier la version en ligne.
location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Politique de sécurité du contenu : à activer après un essai en
    # « Content-Security-Policy-Report-Only » (polices Google, API, photos).
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://api.app-nanei.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}

location = /version.json {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}

# Routes de l'application (/nanei/admin/...) : servies par index.html, le
# routeur React prend le relais. Le renvoi interne vers /index.html applique
# les en-têtes « no-cache » du bloc ci-dessus.
location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
