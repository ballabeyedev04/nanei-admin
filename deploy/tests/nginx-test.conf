# Bloc server du test de démarrage (job 4 de .github/workflows/deploy.yml) :
# même fichier commun qu'en production, servi en HTTP sur le port 80 du
# conteneur. /var/www est le dossier temporaire où deploy/mettre-en-service.sh
# a installé la version (lien symbolique, comme sur le serveur).
server {
    listen 80;
    server_name localhost;
    root /var/www/nanei-admin;
    include /etc/nginx/snippets/nanei-admin-commun.conf;
}
