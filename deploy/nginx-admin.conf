# ═══════════════════════════════════════════════════════════════════════════
#  Nanei admin — exemple de configuration Nginx (https://admin.app-nanei.com)
# ═══════════════════════════════════════════════════════════════════════════
#
#  EXEMPLE à comparer avec la configuration réelle du serveur, puis à
#  appliquer À LA MAIN (voir docs/DEPLOIEMENT_ADMIN.md, « Nginx ») :
#
#    sudo cp deploy/nginx-admin-commun.conf /etc/nginx/snippets/nanei-admin-commun.conf
#    # adapter /etc/nginx/sites-available/<fichier de l'admin> d'après ce modèle
#    sudo nginx -t && sudo systemctl reload nginx
#
#  Points essentiels : `root /var/www/nanei-admin;` INCHANGÉ (c'est désormais un
#  lien symbolique), pas de `disable_symlinks`, en-têtes de cache du fichier
#  commun. Les chemins des certificats sont ceux de Certbot (Let's Encrypt) :
#  garder ceux qui existent déjà sur le serveur.

server {
    listen 80;
    listen [::]:80;
    server_name admin.app-nanei.com;
    return 301 https://$host$request_uri;
}

server {
    # `http2` dans `listen` : compatible avec le Nginx d'Ubuntu 22.04/24.04
    # (la directive `http2 on;` n'existe qu'à partir de Nginx 1.25.1).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.app-nanei.com;

    ssl_certificate     /etc/letsencrypt/live/admin.app-nanei.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.app-nanei.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Lien symbolique vers /var/www/nanei-admin-releases/<version> : Nginx le
    # suit (disable_symlinks est off par défaut, ne pas l'activer).
    root /var/www/nanei-admin;

    # En-têtes de sécurité et de cache (dont HSTS) : dans le fichier commun.
    include /etc/nginx/snippets/nanei-admin-commun.conf;
}
